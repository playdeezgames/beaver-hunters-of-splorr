<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beaver Hunters of SPLORR!!</title>
<style>
  html, body { margin: 0; height: 100%; background: #101418; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; width: min(100vw, calc((100vh - 3.5em) * 640 / 360)); height: auto; }
  footer { color: #8a949e; font: 12px/1.5 sans-serif; text-align: center; padding: 0.4em 1em; }
  footer a { color: #c8d0d8; }
</style>
</head>
<body>
<canvas id="screen" width="640" height="360"></canvas>
<footer>
  Beaver Hunters of SPLORR!! by TheGrumpyGameDev. Code made by an AI agent (Claude Code) at the author's direction.
  Tiles: Urizen by vurmux (CC0). Font: DINOBYTE by mby (CC BY 4.0). Feedback by LootLocker.<br>
  <a href="#" id="feedback-link">Send feedback</a> &middot; <a href="https://thegrumpygamedev.itch.io/">itch.io</a> &middot; <a href="https://playdeezgames.github.io/oeuvre-of-splorr/">more games</a>
</footer>
<script type="text/javascript" src="odin.js"></script>
<script type="text/javascript" src="lootlocker.js"></script>
<script type="text/javascript">
// Feedback through the shared SPLORR!! LootLocker kit. The LootLocker game is not set up yet (the user's
// console setup: Guest Login, CORS Allowlist, a Game feedback category); until domain and key are filled
// in, the form opens but cannot send.
const ll = LootLocker({ domain: "", key: "", version: "0.0.1", idKey: "beaver-hunters-ll-player" });
const feedback = ll.feedbackDialog({ game: "Beaver Hunters of SPLORR!!" });
document.getElementById("feedback-link").addEventListener("click", (e) => { e.preventDefault(); feedback.open(); });

(function () {
  const canvas = document.getElementById("screen");
  const g = canvas.getContext("2d");
  g.imageSmoothingEnabled = false;

  // Sheet order matches `Sheet` in src/web/web.odin.
  const files = ["urizen", "font"];
  const KNOCK_OUT_BLACK = [true, false]; // Urizen's black is opaque in the PNG
  const sheets = files.map(() => null);
  files.forEach((name, i) => {
    const img = new Image();
    img.onload = () => {
      if (!KNOCK_OUT_BLACK[i]) { sheets[i] = img; return; }
      const c = document.createElement("canvas");
      c.width = img.width; c.height = img.height;
      const t = c.getContext("2d");
      t.drawImage(img, 0, 0);
      const d = t.getImageData(0, 0, c.width, c.height);
      for (let p = 0; p < d.data.length; p += 4) {
        if (d.data[p] === 0 && d.data[p + 1] === 0 && d.data[p + 2] === 0) d.data[p + 3] = 0;
      }
      t.putImageData(d, 0, 0);
      sheets[i] = c;
    };
    img.src = "assets/" + name + ".png";
  });

  const hex = (rgb) => "#" + (rgb >>> 0).toString(16).padStart(6, "0");
  const tinted = new Map();
  function tintedSheet(i, rgb) {
    const key = i + ":" + rgb;
    let c = tinted.get(key);
    if (!c) {
      const src = sheets[i];
      c = document.createElement("canvas");
      c.width = src.width; c.height = src.height;
      const t = c.getContext("2d");
      t.drawImage(src, 0, 0);
      t.globalCompositeOperation = "source-in";
      t.fillStyle = hex(rgb);
      t.fillRect(0, 0, c.width, c.height);
      tinted.set(key, c);
    }
    return c;
  }

  const memory = new odin.WasmMemoryInterface();
  const decoder = new TextDecoder();
  const key = (ptr, len) => decoder.decode(new Uint8Array(memory.memory.buffer, ptr, len));

  const imports = {
    canvas: {
      now_ms: () => Date.now(),
      storage_get: (kp, kl, bp, cap) => {
        try {
          const v = localStorage.getItem(key(kp, kl));
          if (v === null) return -1;
          const raw = atob(v);
          if (raw.length > cap) return -1;
          const out = new Uint8Array(memory.memory.buffer, bp, raw.length);
          for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
          return raw.length;
        } catch (e) { return -1; }
      },
      storage_set: (kp, kl, vp, vl) => {
        try {
          const bytes = new Uint8Array(memory.memory.buffer, vp, vl);
          let s = "";
          for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
          localStorage.setItem(key(kp, kl), btoa(s));
        } catch (e) { /* storage blocked or full: the game still plays */ }
      },
      storage_remove: (kp, kl) => {
        try { localStorage.removeItem(key(kp, kl)); } catch (e) {}
      },
      fill_rect: (x, y, w, h, rgb) => { g.fillStyle = hex(rgb); g.fillRect(x, y, w, h); },
      blit: (sheet, sx, sy, w, h, dx, dy, dw, dh, rgb) => {
        if (!sheets[sheet]) return;
        g.drawImage(tintedSheet(sheet, rgb), sx, sy, w, h, dx, dy, dw, dh);
      },
      blit_raw: (sheet, sx, sy, w, h, dx, dy, dw, dh) => {
        if (!sheets[sheet]) return;
        g.drawImage(sheets[sheet], sx, sy, w, h, dx, dy, dw, dh);
      },
    },
  };

  canvas.addEventListener("pointerdown", (e) => {
    const r = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) * canvas.width / r.width);
    const y = Math.floor((e.clientY - r.top) * canvas.height / r.height);
    if (memory.exports && memory.exports.on_click) memory.exports.on_click(x, y);
  });

  window.addEventListener("load", () => {
    odin.runWasm("game.wasm", null, imports, memory);
  });
})();
</script>
</body>
</html>
